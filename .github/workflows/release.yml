name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked build dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Doc2md
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name Doc2md --paths src
          --add-data "${{ github.workspace }}/src/doc2md/pymarkdown.json;doc2md"
          --collect-all markitdown --collect-all magika --collect-all watchdog
          --collect-all pymarkdown --collect-all application_properties
          --collect-all application_file_scanner
          --distpath dist --workpath build/doc2md --specpath build
          src/doc2md/__main__.py
      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke/input,smoke/converted | Out-Null
          Copy-Item dist/Doc2md.exe smoke/
          Set-Content smoke/input/sample.txt "# Release smoke test`n`nClean output."
          $stdout = "smoke/stdout.log"
          $stderr = "smoke/stderr.log"
          Start-Process smoke/Doc2md.exe -WorkingDirectory smoke `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
            -WindowStyle Hidden
          $output = "smoke/converted/sample.txt.md"
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $output)) {
            Start-Sleep -Milliseconds 500
          }
          & taskkill /IM Doc2md.exe /T /F 2>$null | Out-Null
          $processDeadline = (Get-Date).AddSeconds(10)
          while ((Get-Date) -lt $processDeadline -and (Get-Process -Name Doc2md -ErrorAction SilentlyContinue)) {
            Start-Sleep -Milliseconds 200
          }
          if (Get-Process -Name Doc2md -ErrorAction SilentlyContinue) {
            throw "Packaged application process tree is still running."
          }
          if (-not (Test-Path $output)) {
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            throw "Packaged application produced no output."
          }
          $content = Get-Content $output -Raw
          if ($content -notmatch "# Release smoke test") {
            throw "Packaged output has unexpected content."
          }
          python -m pymarkdown --config src/doc2md/pymarkdown.json --strict-config scan $output
          if ($LASTEXITCODE -ne 0) { throw "Packaged output failed strict lint." }
      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Doc2md.exe -DestinationPath Doc2md-Windows-x64.zip
          $hash = (Get-FileHash Doc2md-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Doc2md-Windows-x64.zip" | Set-Content Doc2md-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Doc2md-Windows-x64
          path: |
            Doc2md-Windows-x64.zip
            Doc2md-Windows-x64.zip.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Doc2md-Windows-x64
      - name: Verify artifact checksum
        shell: bash
        run: sha256sum --check Doc2md-Windows-x64.zip.sha256
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: Doc2md-Windows-x64.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            Doc2md-Windows-x64.zip
            Doc2md-Windows-x64.zip.sha256

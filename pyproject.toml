[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2md"
version = "0.1.0"
description = "Convert documents to strict, clean Markdown automatically."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
dependencies = [
  "markitdown[all]==0.1.8",
  "pymarkdownlnt==0.9.40",
  "tomli==2.0.1",
  "watchdog==6.0.0",
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]

[project.scripts]
doc2md = "doc2md.cli:main"

[tool.setuptools.package-data]
doc2md = ["pymarkdown.json"]

[tool.setuptools.packages.find]
where = ["src"]
